# electron-builder config — also embedded in package.json for convenience.
# Build: `npm run build:win` / `:mac` / `:linux`. Output lands in dist/.
appId: com.xrpsync.wallet
productName: XRPSync Wallet
artifactName: XRPSync-Wallet-Setup-${version}.${ext}
directories:
  output: dist
files:
  - main.js
  - preload.js
  - src/**/*
  - assets/**/*
  - package.json
  - node_modules/@node-rs/**          # ensure argon2 main + win32 binary pkg are bundled
asarUnpack:
  - node_modules/@node-rs/**          # unpack so the native .node can be dlopen'd at runtime
  - node_modules/keytar/**            # keytar native module
  - "**/*.node"                        # safety net for any native binary
win:
  target:
    - nsis                              # installer (auto-updates via latest.yml)
    - portable                          # single .exe for a thumb drive — data next to the exe, no auto-update
  icon: assets/icon.ico
  signAndEditExecutable: false
portable:
  artifactName: XRPSync-Wallet-Portable-${version}.${ext}
mac:
  target: dmg
  icon: assets/icon.icns
  category: public.app-category.finance
linux:
  target: AppImage
  icon: assets/icon.png
  category: Finance
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
