name: Release XRPSync Wallet

# Builds the desktop wallet on a version tag and publishes the installers
# straight to this repo's GitHub Releases (electron-builder --publish always).
# Those release assets are what xrpsync.com/download links to and what the
# in-app auto-updater reads (latest*.yml) — built by CI from public source, so
# anyone can verify the binary matches the code.
#
# Cut a release:
#   npm version patch        # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags
#
# Paths are repo-root relative — this repo is the wallet (seeded from the
# monorepo via `git subtree split --prefix=labs-wallet`).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write          # required to create/upload GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe)
            build: npm run build:win
          # Re-enable when ready (macOS auto-update also needs signing):
          # - os: ubuntu-latest
          #   label: Linux (.AppImage)
          #   build: npm run build:linux
          # - os: macos-latest
          #   label: macOS (.dmg)
          #   build: npm run build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build & publish to GitHub Releases
        run: ${{ matrix.build }} -- --publish always
        env:
          # electron-builder auto-creates/uploads to the release for this version.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing in CI yet. Windows + Linux still auto-update fine; macOS
          # auto-update requires signing+notarization (add APPLE_* secrets and
          # remove this line to enable). Until then mac users update manually.
          CSC_IDENTITY_AUTO_DISCOVERY: false
